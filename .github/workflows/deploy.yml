name: CI build check

# The app uses API routes, NextAuth and Prisma, so it cannot be exported as a
# static site for GitHub Pages. Production is deployed by Vercel (vercel.json);
# this workflow only verifies that the app builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_space
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
